name: Crypto package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  archive:
    name: Crypto (fresh archive consumers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - run: rustup show
      - name: Native launcher regression
        run: python3 -B -m unittest discover -s scripts/linux -p 'test_check.py' -v
      - name: Packaged external consumers
        run: python3 ci/check-crypto-package.py

  profiles:
    name: Crypto (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: default
            flags: ""
          - profile: primitives
            flags: --no-default-features --features std,primitives
          - profile: tls13
            flags: --no-default-features --features std,tls-rustcrypto
          - profile: tls12-and-tls13
            flags: --no-default-features --features std,tls-rustcrypto,tls12
          - profile: jwt
            flags: --no-default-features --features std,jwt-rustcrypto
          - profile: combined
            flags: --no-default-features --features std,primitives,aws-lc,jwt,jwt-rustcrypto,tls-rustcrypto,tls-aws-lc,tls12
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - run: rustup show
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
        with:
          key: crypto-${{ matrix.profile }}
      - name: Runtime tests
        run: cargo nextest run --locked -p sid-crypto ${{ matrix.flags }}
      - name: Profile lint
        run: cargo clippy --locked -p sid-crypto --all-targets ${{ matrix.flags }} -- -D warnings
      - name: Doc tests
        run: cargo test --locked -p sid-crypto --doc ${{ matrix.flags }}
      - name: Remove package outputs
        if: success()
        run: cargo clean -p sid-crypto

  alloc:
    name: Crypto (Rust 1.92 bare metal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Supported compiler and target
        run: rustup toolchain install 1.92.0 --profile minimal --target thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
        with:
          key: crypto-alloc-1.92
      - name: Base alloc contract
        run: cargo +1.92.0 check --locked -p sid-crypto --no-default-features --features alloc --target thumbv7em-none-eabihf
      - name: RustCrypto TLS alloc contract
        env:
          RUSTFLAGS: --cfg getrandom_backend="custom"
        run: cargo +1.92.0 check --locked -p sid-crypto --no-default-features --features alloc,tls-rustcrypto --target thumbv7em-none-eabihf
      - name: RustCrypto primitives alloc contract
        env:
          RUSTFLAGS: --cfg getrandom_backend="custom"
        run: cargo +1.92.0 check --locked -p sid-crypto --no-default-features --features alloc,primitives --target thumbv7em-none-eabihf
      - name: Remove package outputs
        if: success()
        run: cargo clean -p sid-crypto --target thumbv7em-none-eabihf
