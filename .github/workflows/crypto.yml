name: Crypto package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# One job: every check here builds the one package and takes under a minute,
# less than a runner's own setup. The host builds link with mold (see
# ci.yml); the bare-metal checks build for their own target.
jobs:
  crypto:
    name: Crypto package
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C linker-features=-lld -C link-arg=-fuse-ld=mold
    steps:
      - uses: rui314/setup-mold@v1
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Latest stable compiler and the bare-metal target
        run: rustup update stable --no-self-update && rustup target add thumbv7em-none-eabihf
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
        with:
          key: crypto
      # Each feature profile's tests, lint and doc tests; every profile runs,
      # then the step fails if any did.
      - name: Feature profiles
        run: |
          status=0
          profiles=(
            "default|"
            "primitives|--no-default-features --features std,primitives"
            "tls13|--no-default-features --features std,tls-rustcrypto"
            "tls12-and-tls13|--no-default-features --features std,tls-rustcrypto,tls12"
            "jwt|--no-default-features --features std,jwt-rustcrypto"
            "combined|--no-default-features --features std,primitives,aws-lc,jwt,jwt-rustcrypto,tls-rustcrypto,tls-aws-lc,tls12"
          )
          for entry in "${profiles[@]}"; do
            name="${entry%%|*}"
            read -ra flags <<< "${entry#*|}"
            echo "::group::profile $name"
            cargo nextest run --locked -p sid-crypto "${flags[@]}" || status=1
            cargo clippy --locked -p sid-crypto --all-targets "${flags[@]}" -- -D warnings || status=1
            cargo test --locked -p sid-crypto --doc "${flags[@]}" || status=1
            echo "::endgroup::"
          done
          exit "$status"
      - name: Base alloc contract
        run: cargo check --locked -p sid-crypto --no-default-features --features alloc --target thumbv7em-none-eabihf
      - name: RustCrypto TLS alloc contract
        env:
          RUSTFLAGS: --cfg getrandom_backend="custom"
        run: cargo check --locked -p sid-crypto --no-default-features --features alloc,tls-rustcrypto --target thumbv7em-none-eabihf
      - name: RustCrypto primitives alloc contract
        env:
          RUSTFLAGS: --cfg getrandom_backend="custom"
        run: cargo check --locked -p sid-crypto --no-default-features --features alloc,primitives --target thumbv7em-none-eabihf
      - name: Native launcher regression
        run: python3 -B -m unittest discover -s scripts/linux -p 'test_check.py' -v
      - name: Packaged external consumers
        run: python3 ci/check-crypto-package.py
      - name: Remove package outputs
        if: success()
        run: |
          cargo clean -p sid-crypto
          cargo clean -p sid-crypto --target thumbv7em-none-eabihf
