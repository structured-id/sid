name: Dependabot auto-merge

# Dependabot pull requests merge themselves once the required checks pass,
# major updates included. This runs on a schedule and after every push to
# main rather than on the pull request: a run started by Dependabot gets no
# Actions secrets, and auto-merge enabled with GITHUB_TOKEN would land on main
# without starting the workflows of that push. The app token avoids both.
on:
  schedule:
    - cron: "17 */3 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependabot-auto-merge
  cancel-in-progress: false

jobs:
  auto-merge:
    name: Auto-merge
    if: github.repository_owner == 'structured-id'
    runs-on: ubuntu-latest
    steps:
      - name: App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASER_CLIENT_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}

      - name: Queue open Dependabot pull requests
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A plain assignment, so a failed query fails the step under bash -e;
          # inside the `for` list it would read as no pull requests.
          prs=$(gh pr list --author app/dependabot --state open --json number --jq '.[].number')
          status=0
          for pr in $prs; do
            # One query per pull request. A failed query marks the run failed
            # and moves on to the next pull request; read inside an `if` test
            # it would only read as "no".
            if ! state=$(gh pr view "$pr" --json autoMergeRequest,mergeStateStatus \
                --jq '"\(.autoMergeRequest == null) \(.mergeStateStatus)"'); then
              status=1
              continue
            fi
            read -r unqueued merge_state <<< "$state"
            if [ "$unqueued" = "true" ]; then
              gh pr merge --auto --squash "$pr" || status=1
            fi
            # Required checks are strict: a pull request behind main must be
            # brought up to date, and Dependabot rebases on its own only on a
            # conflict or at its next scheduled run.
            if [ "$merge_state" = "BEHIND" ]; then
              gh pr update-branch "$pr" || status=1
            fi
          done
          exit "$status"
