name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# The jobs that build Rust link the host target with mold, installed by
# their first step: fewer threads and less disk work than the bundled
# rust-lld. Opting out of rust-lld is stable only on the x86_64 Linux target,
# so the flags are that target's. A build with `--target` (musl through zig)
# keeps its own linkers: Cargo gives host flags to no build of it.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C linker-features=-lld -C link-arg=-fuse-ld=mold
    steps:
      - uses: rui314/setup-mold@v1
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      # The runner image's stable may lag; `rustup update` brings the latest.
      - name: Latest stable toolchain
        run: rustup update stable --no-self-update
      - name: protoc with the well-known types
        uses: taiki-e/install-action@v2
        with:
          tool: protoc
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  # The workspace tests in groups of crates, each built and run on its own
  # runner. In one job the build took 8.5 minutes and the run 21: the
  # storage engines' tests, the ZKPP password flows and the cryptographic
  # cores the longest of it. Each group builds only its own packages' tests
  # (`-p`); `rest` is the workspace without the packages the groups above
  # name, so a new crate lands there.
  tests:
    name: Tests (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: storage
            args: -p sid-storage -p sid-authz
          - group: crypto
            args: >-
              -p sid-authn -p sid-core -p sid-keys -p sid-opaque-ke -p sid-voprf
              -p sid-crypto
          - group: server flows
            browser: true
            args: >-
              -p sid-server -E 'binary_id(sid-server::zkpp_password_change)
              | binary_id(sid-server::packaged_password_client)
              | binary_id(sid-server::zkpp_login)'
          - group: server
            args: >-
              -p sid-server -E 'not (binary_id(sid-server::zkpp_password_change)
              | binary_id(sid-server::packaged_password_client)
              | binary_id(sid-server::zkpp_login))'
          - group: rest
            doc: true
            args: >-
              --workspace --exclude sid-storage --exclude sid-authz
              --exclude sid-authn --exclude sid-core --exclude sid-keys
              --exclude sid-opaque-ke --exclude sid-voprf --exclude sid-crypto
              --exclude sid-server
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C linker-features=-lld -C link-arg=-fuse-ld=mold
    steps:
      - uses: rui314/setup-mold@v1
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Latest stable toolchain
        run: rustup update stable --no-self-update
      - name: protoc with the well-known types
        uses: taiki-e/install-action@v2
        with:
          tool: protoc
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
        with:
          key: tests-${{ matrix.group }}
      # PostgreSQL, Redis and NATS as the integration tests expect them locally.
      - name: Test services
        run: docker compose -f docker-compose.test.yml up -d --wait
      # The embedded event bus runs nats-server as a child process; the tests
      # use the binary the runtime images ship.
      - name: nats-server from the runtime image
        run: |
          id=$(docker create nats:2.15-alpine)
          sudo docker cp "$id":/usr/local/bin/nats-server /usr/local/bin/nats-server
          docker rm "$id"
          nats-server --version
      # The published password client runs only in the group of its tests.
      - uses: actions/setup-node@v7
        if: matrix.browser
        with:
          node-version: 24
      - name: Immutable published password client
        if: matrix.browser
        run: npm ci --ignore-scripts --prefix ci/password-clients
      # The runner image carries Chromium's system libraries; no apt step, its
      # mirror is not always resolvable from the runners.
      - name: Browser for published client conformance
        if: matrix.browser
        run: ci/password-clients/node_modules/.bin/playwright install chromium
      # The ZKPP circuit crate comes from the zkpp submodule as a dependency, not
      # a workspace member, and is tested in its own repository with optimized
      # builds; sid-crypto holds the server primitives and runs here.
      - name: Tests
        env:
          ARGS: ${{ matrix.args }}
        run: eval cargo nextest run --locked --all-features --profile ci "$ARGS"
      - name: Doc tests
        if: matrix.doc
        run: cargo test --locked --doc --workspace --all-features

  # The check the branch rules require: passes only when every group did.
  test:
    name: Test
    if: always()
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Every group passed
        env:
          RESULT: ${{ needs.tests.result }}
        run: |
          echo "test groups: $RESULT"
          [[ "$RESULT" == "success" ]]

  # The isolation checks in eight parallel clusters of similar length. Run
  # in sequence on the hosted runner they took 44 minutes: the feature
  # combinations 18, the per-feature checks 13, the server powerset 9, the
  # rest 3; each cluster here holds at most about 6.5 minutes of that.
  # Each cluster runs one or more parts of the script.
  isolation:
    name: Isolation (${{ matrix.cluster }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cluster: combos 1/3
            parts: "combos:1/3"
          - cluster: combos 2/3
            parts: "combos:2/3"
          - cluster: combos 3/3
            parts: "combos:3/3"
          - cluster: each feature 1/2
            parts: "each-workspace:1/2"
          - cluster: each feature 2/2
            parts: "each-workspace:2/2"
          - cluster: server powerset 1/2
            parts: "each-server:1/2"
          - cluster: server powerset 2/2
            parts: "each-server:2/2"
          - cluster: closures and consumers
            parts: "closure crypto transport consumers each-migrate"
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C linker-features=-lld -C link-arg=-fuse-ld=mold
    steps:
      - uses: rui314/setup-mold@v1
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Latest stable toolchain
        run: rustup update stable --no-self-update
      - name: protoc with the well-known types
        uses: taiki-e/install-action@v2
        with:
          tool: protoc
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - uses: Swatinem/rust-cache@v2
        with:
          key: isolation-${{ matrix.parts }}
      # Each package builds with the features it declares itself: a workspace
      # build unifies features across packages and hides a missing declaration.
      # Client-facing packages also must not pull server or storage crates.
      # Every part of the cluster runs, then the cluster fails if any did.
      - name: Isolation checks
        env:
          PARTS: ${{ matrix.parts }}
        run: |
          status=0
          for part in $PARTS; do
            args=("${part%%:*}")
            [[ "$part" == *:* ]] && args+=("${part#*:}")
            ci/check-dependency-isolation.sh "${args[@]}" || status=1
          done
          exit "$status"

  # The check the branch rules require: passes only when every cluster did.
  dependency-isolation:
    name: Dependency isolation
    if: always()
    needs: isolation
    runs-on: ubuntu-latest
    steps:
      - name: Every cluster passed
        env:
          RESULT: ${{ needs.isolation.result }}
        run: |
          echo "isolation clusters: $RESULT"
          [[ "$RESULT" == "success" ]]

  engine-package:
    name: Engine (packaged external consumer)
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C linker-features=-lld -C link-arg=-fuse-ld=mold
    steps:
      - uses: rui314/setup-mold@v1
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Latest stable toolchain
        run: rustup update stable --no-self-update
      - name: protoc with the well-known types
        uses: taiki-e/install-action@v2
        with:
          tool: protoc
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Packages the engine closure, builds a fresh host against the archives
      # only, checks its dependency graph and runs it.
      - run: node ci/check-engine-package.ts

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Latest stable toolchain
        run: rustup update stable --no-self-update
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny,cargo-cyclonedx
      # RUSTSEC-2026-0381 names webpki-roots 0.26.11 only by version: that
      # release re-exports TLS_SERVER_ROOTS from webpki-roots 1, which the lock
      # keeps at the fixed 1.0.10 (async-nats → tokio-websockets still asks
      # for 0.26).
      - name: Vulnerability audit
        run: cargo audit --ignore RUSTSEC-2025-0134 --ignore RUSTSEC-2026-0381
      - name: License and ban check
        run: cargo deny check
      - name: SBOM (CycloneDX)
        run: cargo cyclonedx --all --format json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: "**/*.cdx.json"
          retention-days: 90

  musl:
    name: Build (x86_64 musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Latest stable toolchain and the musl target
        run: rustup update stable --no-self-update && rustup target add x86_64-unknown-linux-musl
      - name: protoc with the well-known types
        uses: taiki-e/install-action@v2
        with:
          tool: protoc
      # zig compiles the C of ring and SQLite for musl without a cross GCC.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - uses: Swatinem/rust-cache@v2
      - run: cargo zigbuild --locked --release -p sid-server --target x86_64-unknown-linux-musl
