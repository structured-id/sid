name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show
      - name: protoc with the well-known types
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler libprotobuf-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show
      - name: protoc with the well-known types
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler libprotobuf-dev
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
      # PostgreSQL, Redis and NATS as the integration tests expect them locally.
      - name: Test services
        run: docker compose -f docker-compose.test.yml up -d --wait
      # The embedded event bus runs nats-server as a child process; the tests
      # use the binary the runtime images ship.
      - name: nats-server from the runtime image
        run: |
          id=$(docker create nats:2.15-alpine)
          sudo docker cp "$id":/usr/local/bin/nats-server /usr/local/bin/nats-server
          docker rm "$id"
          nats-server --version
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Immutable published password client
        run: npm ci --ignore-scripts --prefix ci/password-clients
      - name: Browser for published client conformance
        run: ci/password-clients/node_modules/.bin/playwright install --with-deps chromium
      # The ZKPP circuit crate comes from the zkpp submodule as a dependency, not
      # a workspace member, and is tested in its own repository with optimized
      # builds; sid-crypto holds the server primitives and runs here.
      - name: Tests
        run: cargo nextest run --locked --workspace --all-features --profile ci
      - name: Doc tests
        run: cargo test --locked --doc --workspace --all-features

  dependency-isolation:
    name: Dependency isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show
      - name: protoc with the well-known types
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler libprotobuf-dev
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - uses: Swatinem/rust-cache@v2
      # Each package builds with the features it declares itself: a workspace
      # build unifies features across packages and hides a missing declaration.
      # Client-facing packages also must not pull server or storage crates.
      - run: ci/check-dependency-isolation.sh all

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny,cargo-cyclonedx
      - name: Vulnerability audit
        run: cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2025-0134
      - name: License and ban check
        run: cargo deny check
      - name: SBOM (CycloneDX)
        run: cargo cyclonedx --all --format json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: "**/*.cdx.json"
          retention-days: 90

  musl:
    name: Build (x86_64 musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Toolchain (rust-toolchain.toml) and the musl target
        run: rustup show && rustup target add x86_64-unknown-linux-musl
      - name: protoc with the well-known types
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler libprotobuf-dev
      # zig compiles the C of ring and SQLite for musl without a cross GCC.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - uses: Swatinem/rust-cache@v2
      - run: cargo zigbuild --locked --release -p sid-server --target x86_64-unknown-linux-musl
