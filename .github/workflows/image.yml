# The server images on ghcr.io/structured-id/sid:
# - embedded (Dockerfile.embedded): SQLite, in-process event bus, REST and
#   gRPC; tagged <version>-embedded and embedded;
# - ce (Dockerfile): PostgreSQL storage, bundled NATS, REST and gRPC, packing
#   a binary built here with the default features; tagged <version> and
#   latest.
# A server release tag `v<version>` publishes one multi-arch manifest per
# image under its versioned tag, and moves the floating tag to it when it is
# the latest release; a pull request that touches an image only builds it.
# Each architecture builds on its own native runner (emulated arm64 would
# compile the workspace for hours), pushes by digest, and the manifest joins
# them.
name: Image

on:
  push:
    tags: ["v[0-9]*"]
  # Any base: a pull request stacked on another one is checked too.
  pull_request:
    paths:
      - Dockerfile
      - Dockerfile.embedded
      - .dockerignore
      - .github/workflows/image.yml

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/structured-id/sid

jobs:
  build:
    name: Build ${{ matrix.variant }} (${{ matrix.platform }})
    if: github.repository_owner == 'structured-id'
    strategy:
      fail-fast: true
      matrix:
        variant: [embedded, ce]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            release_only: true
          - variant: embedded
            file: Dockerfile.embedded
          - variant: ce
            file: Dockerfile
            host_binary: true
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Skip arm64 on pull requests
        id: scope
        run: echo "run=${{ github.event_name != 'pull_request' || !matrix.release_only }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.scope.outputs.run == 'true'
        with:
          submodules: recursive
          persist-credentials: false
      # The CE image packs a binary built on the runner (Dockerfile copies
      # target/release/sid); the embedded image compiles inside its build.
      - name: Toolchain (rust-toolchain.toml)
        if: steps.scope.outputs.run == 'true' && matrix.host_binary
        run: rustup show
      - name: protoc with the well-known types
        if: steps.scope.outputs.run == 'true' && matrix.host_binary
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler libprotobuf-dev
      - uses: Swatinem/rust-cache@v2
        if: steps.scope.outputs.run == 'true' && matrix.host_binary
      - name: Server binary
        if: steps.scope.outputs.run == 'true' && matrix.host_binary
        run: cargo build --locked --release -p sid-server && strip target/release/sid
      - uses: docker/setup-buildx-action@v3
        if: steps.scope.outputs.run == 'true'
      - uses: docker/login-action@v3
        if: steps.scope.outputs.run == 'true' && github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        id: build
        if: steps.scope.outputs.run == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platform }}
          # A pull request only proves the image builds; a release pushes it
          # untagged, by digest, for the manifest job below.
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) }}
      - name: Record the digest
        if: steps.scope.outputs.run == 'true' && github.event_name != 'pull_request'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        if: steps.scope.outputs.run == 'true' && github.event_name != 'pull_request'
        with:
          name: digest-${{ matrix.variant }}-${{ matrix.runner }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ matrix.variant }}
    if: github.repository_owner == 'structured-id' && github.event_name != 'pull_request'
    needs: build
    strategy:
      matrix:
        include:
          - variant: embedded
            suffix: -embedded
            floating: embedded
          - variant: ce
            suffix: ""
            floating: latest
    runs-on: ubuntu-latest
    # One publication of an image at a time across all tags, none cancelled:
    # with the latest-release check below, the floating tag ends on the
    # newest release whatever order the runs finish in.
    concurrency:
      group: image-publish-${{ matrix.variant }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true
          persist-credentials: false
      - name: Latest server release
        id: latest
        run: |
          latest=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)
          echo "tag=${latest}" >> "$GITHUB_OUTPUT"
          echo "latest server release: ${latest}; this run: ${GITHUB_REF_NAME}"
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-${{ matrix.variant }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          LATEST: ${{ steps.latest.outputs.tag }}
          SUFFIX: ${{ matrix.suffix }}
          FLOATING: ${{ matrix.floating }}
        run: |
          versioned="${IMAGE}:${GITHUB_REF_NAME#v}${SUFFIX}"
          set -- -t "$versioned"
          # A rerun of an older release republishes its own version only.
          if [ "$GITHUB_REF_NAME" = "$LATEST" ]; then
            set -- "$@" -t "${IMAGE}:${FLOATING}"
          fi
          for digest in *; do set -- "$@" "${IMAGE}@sha256:${digest}"; done
          docker buildx imagetools create "$@"
          docker buildx imagetools inspect "$versioned"
