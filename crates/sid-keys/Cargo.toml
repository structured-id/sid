[package]
name = "sid-keys"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
repository.workspace = true
authors.workspace = true
description = "Field-level encryption for applications: cryptographic primitives, versioned keys derived from a host-supplied master secret, and context-bound encrypted fields. Depends on no identity, storage or server crate."

[dependencies]
aes-gcm = { workspace = true }
async-trait = { workspace = true }
hkdf = { workspace = true }
hmac = { workspace = true }
pbkdf2 = { workspace = true }
rand = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true, features = ["derive"] }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
