[package]
name = "sid-keys"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
repository.workspace = true
authors.workspace = true
description = "Field-level encryption and certificate signing for applications: cryptographic primitives, versioned keys derived from a host-supplied master secret, context-bound encrypted fields and key-bound signers. Depends on no identity, storage or server crate."

[dependencies]
aes-gcm = { workspace = true }
async-trait = { workspace = true }
hkdf = { workspace = true }
hmac = { workspace = true }
p256 = { workspace = true, features = ["ecdsa", "pkcs8"] }
pbkdf2 = { workspace = true }
rand = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true, features = ["derive"] }

[dev-dependencies]
p384 = { workspace = true, features = ["ecdsa", "pkcs8"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
