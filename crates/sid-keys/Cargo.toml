[package]
name = "sid-keys"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
repository.workspace = true
authors.workspace = true
description = "Field-level encryption with host-selected primitives, versioned keys derived from a supplied master secret, and context-bound encrypted fields"

[dependencies]
sid-crypto = { workspace = true, features = ["std"] }
async-trait = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true, features = ["derive"] }

[dev-dependencies]
sid-crypto = { workspace = true, features = ["primitives"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
