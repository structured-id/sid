[package]
name = "sid-test-issuer"
description = "A SID issuer served over gRPC for the tests of services that verify its tokens"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Test support only: never published, never a runtime dependency.
publish = false

[dependencies]
# The SQLite build of the server: the engine this issuer stores in.
sid-server = { path = "../sid-server", default-features = false, features = ["embedded-dev"] }
sid-core = { workspace = true }
sid-keys = { workspace = true }
sid-crypto = { workspace = true, features = ["std", "primitives", "jwt"] }
sid-plugin = { workspace = true }
sid-authn = { workspace = true, features = ["password-operation"] }
# A test client's own credential at the issuer, and the evaluator's RPC
# adapter.
sid-infra = { workspace = true, features = ["issuer-client", "password-operation"] }
sid-authz = { workspace = true }
sid-proto = { workspace = true, features = ["grpc"] }
sid-storage = { workspace = true, default-features = false, features = ["storage-sqlite"] }
sid-auth = { path = "../sid-auth", default-features = false }
arc-swap = { workspace = true }
chrono = { workspace = true }
secrecy = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tokio-stream = "0.1.19"
tonic = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
# The client side of the password ceremonies a test user signs in with.
sid-opaque-ke = { workspace = true }
sid-pake-core = { workspace = true }
pasta_curves = { workspace = true }
ff = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# A split password history evaluator is exercised with a real registration
# request and checks the evaluator's proof.
sid-ids = { workspace = true }
group = { workspace = true }
