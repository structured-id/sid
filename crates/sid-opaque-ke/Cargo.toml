[package]
name = "sid-opaque-ke"
description = "The OPAQUE password-authenticated key exchange (RFC 9807), vendored from facebook/opaque-ke and kept on the current RustCrypto releases"
authors = ["Kevin Lewi <klewi@fb.com>", "François Garillot <fga@fb.com>", "StructuredID Contributors"]
categories = ["no-std"]
exclude = ["/src/tests/"]
keywords = ["cryptography", "crypto", "opaque", "passwords", "authentication"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/structured-id/sid"
version = "5.0.0"
edition = "2024"
rust-version = "1.87"

[features]
argon2 = ["dep:argon2"]
curve25519 = ["dep:curve25519-dalek"]
default = ["ristretto255", "serde"]
ecdsa = ["dep:ecdsa"]
ed25519 = ["dep:curve25519-dalek", "dep:ed25519-dalek"]
kem = ["dep:ml-kem"]
ristretto255 = ["dep:curve25519-dalek", "sid-voprf/ristretto255-ciphersuite"]
serde = [
  "dep:serde",
  "curve25519-dalek?/serde",
  "ecdsa?/serde",
  "ed25519-dalek?/serde",
  "elliptic-curve/serde",
  "hybrid-array/serde",
  "sid-voprf/serde",
  "zeroize/serde",
]
std = []

[dependencies]
argon2 = { version = "0.6", default-features = false, features = ["alloc"], optional = true }
curve25519-dalek = { version = "5", default-features = false, features = ["zeroize"], optional = true }
derive-where = { version = "1.7", features = ["zeroize-on-drop"] }
digest = "0.11"
displaydoc = { version = "0.2", default-features = false }
ecdsa = { version = "0.17", default-features = false, features = ["algorithm"], optional = true }
ed25519-dalek = { version = "3", default-features = false, features = ["digest", "hazmat"], optional = true }
elliptic-curve = { version = "0.14", features = ["sec1"] }
hkdf = "0.13"
hmac = "0.13"
# Primitives (keys, hashes, nonces) are RustCrypto `hybrid_array::Array`s.
# Serialized messages concatenate them into lengths outside the sizes
# hybrid-array implements, so message arrays are `generic_array` arrays of any
# typenum length.
generic-array = { version = "1", features = ["hybrid-array-0_4", "serde", "zeroize"] }
hybrid-array = "0.4"
ml-kem = { version = "0.3", default-features = false, features = ["zeroize"], optional = true }
rand_core = { version = "0.10", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"], optional = true }
sid-voprf = { path = "../sid-voprf", version = "0.6", default-features = false, features = ["danger"] }
subtle = { version = "2.6", default-features = false }
zeroize = { version = "1.9", features = ["zeroize_derive"] }

[dev-dependencies]
anyhow = "1"
# Binary serde format for the serialization tests (bincode is unmaintained).
postcard = { version = "1", default-features = false, features = ["alloc"] }
chacha20poly1305 = "0.11"
criterion = "0.8"
cryptoki = "0.12"
elliptic-curve = { version = "0.14", features = ["alloc", "pkcs8"] }
hex = "0.4"
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "oprf", "pkcs8"] }
p384 = { version = "0.14", default-features = false, features = ["oprf", "pkcs8"] }
p521 = { version = "0.14", default-features = false, features = ["oprf", "pkcs8"] }
pastey = "0.2"
proptest = "1"
rand = "0.10"
rand_chacha = "0.10"
regex = "1"
rustyline = "18"
scrypt = "0.12"
serde_json = "1"
sha2 = { version = "0.11", default-features = false }
thiserror = "2"

[[bench]]
harness = false
name = "opaque"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "simple_login"
required-features = ["argon2"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(test_hsm)'] }
