[package]
name = "sid-infra"
description = "StructuredID Infrastructure Backends - NATS, Redis and issuer client implementations"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
sid-plugin = { workspace = true }
sid-core = { workspace = true }
async-trait = { workspace = true }
async-nats = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
fred = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# The HTTP form of a service's own annotated RPCs (`http` feature).
sid-proto = { workspace = true, optional = true }
structured-proxy = { version = "8.1.4", default-features = false, optional = true }
prost-reflect = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
# The issuer RPC clients (`issuer-client` feature) and the inbound
# authentication adapters (`authn-grpc` feature).
sid-authn = { workspace = true, optional = true }
tonic = { workspace = true, optional = true }
# The canonical gRPC status: google.rpc.Status with typed details (`grpc`).
tonic-types = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
prost-types = { workspace = true, optional = true }
# The sign-in page's origin and the sign-in's ids (`authn-grpc`), the
# password operation's wire ids (`password-operation`).
url = { workspace = true, optional = true }
sid-ids = { workspace = true, features = ["std", "serde"], optional = true }
sid-ids-proto = { workspace = true, optional = true }
http = { workspace = true, optional = true }
secrecy = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
# The bound on a whole issuer answer, its body included.
http-body = { version = "1", optional = true }
bytes = { version = "1", optional = true }
tower = { workspace = true, optional = true }

[features]
# Each backend is its own capability: a consumer of one never builds or
# connects the others.
nats = ["dep:async-nats", "dep:futures", "dep:chrono"]
redis = ["dep:fred"]
issuer-client = [
    "dep:sid-authn",
    "dep:sid-proto",
    "sid-proto/grpc",
    "dep:tonic",
    "dep:http",
    "dep:secrecy",
    "dep:base64",
    "dep:http-body",
    "dep:bytes",
    "dep:tower",
    "tokio/time",
    "tokio/macros",
]
# The canonical status every service answers with: `google.rpc.Status`
# carrying `ErrorInfo` and the typed details, and the shared refusals.
grpc = ["dep:tonic", "dep:tonic-types", "dep:prost", "dep:prost-types"]
# The gRPC entry points of the authentication core: caller, machine,
# service and connector authentication, ceremony context and delivery,
# keyed operation context, refusals.
authn-grpc = [
    "grpc",
    "dep:sid-authn",
    "sid-authn/keyed",
    "dep:sid-proto",
    "sid-proto/grpc",
    "dep:http",
    "dep:tower",
    "dep:futures",
    "dep:secrecy",
    "dep:chrono",
    "dep:url",
    "dep:sid-ids",
]
# The password operation's refusals and the history evaluator's RPC
# adapter, both sides.
password-operation = [
    "authn-grpc",
    "sid-authn/password-operation",
    "dep:sid-ids-proto",
]
# The HTTP form of an issuer's OAuth endpoints over `google.api.HttpBody`.
oauth-http = ["authn-grpc"]
http = [
    "grpc",
    "dep:sid-proto",
    "dep:structured-proxy",
    "dep:prost-reflect",
    "dep:anyhow",
]

[dev-dependencies]
# The tests exercise every backend.
sid-infra = { path = ".", features = [
    "nats",
    "redis",
    "http",
    "issuer-client",
    "password-operation",
    "oauth-http",
] }
# The shared adapters' tests run the cores over an in-memory store.
sid-storage = { workspace = true, features = ["storage-sqlite"] }
sid-keys = { workspace = true }
sid-crypto = { workspace = true, features = ["primitives"] }
sid-proto = { workspace = true }
secrecy = { workspace = true }
chrono = { workspace = true }
# Client assertions are decoded and credential files written by the tests.
jsonwebtoken = { workspace = true }
tempfile = "3"
# Redis runs the cache conformance scenarios.
sid-plugin = { workspace = true, features = ["conformance"] }
# Configurations in the tests are written as YAML, as operators write them.
serde-saphyr = { workspace = true }
# The transcoder's request body type, for calls made in the tests.
axum = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
# The Redis tests share one server, so each takes a key of its own.
uuid = { workspace = true }
# An empty set of services stands in for the embedder's own.
tonic = { workspace = true }
http-body-util = "0.1"
tower = { workspace = true, features = ["util"] }
