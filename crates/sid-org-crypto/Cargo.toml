[package]
name = "sid-org-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Per-org cryptographic state: envelope encryption (Cluster KEK → Org DEK → CA priv), pluggable KekSource, TTL-cached unwrap, CA certificate issuance through a key-bound signer."

[dependencies]
async-trait.workspace = true
secrecy.workspace = true
zeroize = { workspace = true, features = ["derive"] }
aes-gcm.workspace = true
rand = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tracing = "0.1"
hex = "0.4"
sid-keys = { workspace = true }
signature = "3"
x509-cert = { version = "0.3", features = ["builder"] }
# LDAP string preparation of distinguished names (RFC 4518): case folding,
# NFKC and general categories.
icu_casemap = "2.3"
icu_normalizer = "2.3"
icu_properties = "2.3"
base64 = { workspace = true, optional = true }
kube = { version = "4.2", default-features = false, features = ["client", "rustls-tls"], optional = true }
k8s-openapi = { version = "0.28", features = ["v1_32"], optional = true }

[features]
default = []
k8s = ["dep:kube", "dep:k8s-openapi", "dep:base64"]

[dev-dependencies]
p256 = { workspace = true, features = ["ecdsa", "pkcs8"] }
tokio = { workspace = true, features = ["macros", "rt"] }
uuid = { workspace = true }
x509-parser = { workspace = true }
