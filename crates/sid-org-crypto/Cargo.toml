[package]
name = "sid-org-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Per-org cryptographic state: envelope encryption (Cluster KEK → Org DEK), pluggable KekSource, TTL-cached unwrap."

[dependencies]
async-trait.workspace = true
secrecy.workspace = true
zeroize = { workspace = true, features = ["derive"] }
aes-gcm.workspace = true
rand = { workspace = true }
thiserror = { workspace = true }
# `fs`: the mounted KEK is read from its files.
tokio = { workspace = true, features = ["sync", "time", "fs"] }
tracing = "0.1"
hex = "0.4"

[features]
default = []

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
tempfile = "3"
