[package]
name = "sid-org-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Per-org cryptographic state: envelope encryption (Cluster KEK → Org DEK), pluggable KekSource, TTL-cached unwrap."

[dependencies]
async-trait.workspace = true
secrecy.workspace = true
zeroize = { workspace = true, features = ["derive"] }
aes-gcm.workspace = true
rand = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tracing = "0.1"
hex = "0.4"
base64 = { workspace = true, optional = true }
kube = { version = "4.2", default-features = false, features = ["client", "rustls-tls"], optional = true }
# No Kubernetes version feature here: the binary enabling `k8s` chooses the
# version of the cluster it runs on, once per dependency graph.
k8s-openapi = { version = "0.28", optional = true }

[features]
default = []
k8s = ["dep:kube", "dep:k8s-openapi", "dep:base64"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
# The version this crate's own checks and tests build against.
k8s-openapi = { version = "0.28", features = ["v1_36"] }
