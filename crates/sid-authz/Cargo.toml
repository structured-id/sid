[package]
name = "sid-authz"
description = "StructuredID Authorization: RBAC + ABAC (Cedar)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "sid_authz"
path = "src/lib.rs"

[dependencies]
sid-authn = { workspace = true, optional = true }
sid-core = { workspace = true }
sid-plugin = { workspace = true }
sid-proto = { workspace = true, optional = true }
# Checked conversions of the identifier messages the services carry.
sid-ids-proto = { workspace = true, optional = true }
async-trait = { workspace = true }
cedar-policy = { workspace = true }
chrono = { workspace = true }
# The compiled policy sets, shared by concurrent decisions.
dashmap = { workspace = true }
prost = { workspace = true, optional = true }
prost-types = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tonic = { workspace = true, optional = true }
# Reads which field a refusal names, to tell a refused token from other refusals.
tonic-types = { workspace = true, optional = true }
tracing = { workspace = true }
uuid = { workspace = true }

[features]
default = ["grpc"]
grpc = ["dep:sid-authn", "sid-authn/grpc", "sid-core/grpc", "dep:sid-proto", "dep:sid-ids-proto", "dep:tonic", "dep:tonic-types", "dep:prost", "dep:prost-types"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# The administration benchmark runs against both storage engines.
sid-storage = { workspace = true, features = ["storage-pg", "storage-sqlite"] }

# P50/P99 of role administration on both engines; percentiles need a
# harness of its own.
[[bench]]
name = "role_administration"
harness = false

# P50/P99, allocations and concurrent throughput of permission checks.
[[bench]]
name = "check_latency"
harness = false
