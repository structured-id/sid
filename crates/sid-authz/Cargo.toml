[package]
name = "sid-authz"
description = "StructuredID Authorization: RBAC + ABAC (Cedar)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "sid_authz"
path = "src/lib.rs"

[dependencies]
sid-core = { workspace = true }
sid-plugin = { workspace = true }
async-trait = { workspace = true }
cedar-policy = { workspace = true }
jiff = { workspace = true }
# The compiled policy sets, shared by concurrent decisions.
dashmap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# The benchmarks and the decision scenarios run against every storage engine.
sid-storage = { workspace = true, features = ["storage-pg", "storage-sqlite", "storage-coordinode"] }
# The registration helpers the decision scenarios store resources with.
sid-plugin = { workspace = true, features = ["conformance"] }
# A CoordiNode database in memory for the decision scenarios.
coordinode-embed = "0.9"
# Each PostgreSQL decision scenario drops the schema it ran in.
sqlx = { workspace = true, features = ["postgres"] }

# P50/P99 of role administration on both engines; percentiles need a
# harness of its own.
[[bench]]
name = "role_administration"
harness = false

# P50/P99, allocations and concurrent throughput of permission checks.
[[bench]]
name = "check_latency"
harness = false
