[package]
name = "sid-fed"
description = "StructuredID Federation - X.509 certificate chains and instance discovery"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
sid-core = { workspace = true }
# The store of the admitted platform CA set and of published status.
sid-plugin = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }
url = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
jiff = { workspace = true }
uuid = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
subtle = { workspace = true }
# The certificates a recipient verifies: their decoding, and RFC 5280 path
# processing from the shared PKIX implementation.
x509-cert = { version = "0.3" }
der = { version = "0.8", features = ["derive", "oid"] }
structured-pkix = { version = "0.25", features = ["alloc"] }
structured-asn1 = { version = "0.25", features = ["alloc"] }
p256 = { workspace = true, features = ["ecdsa", "pkcs8"] }
# The site's own key: generated once, kept sealed by its installation.
rand = { workspace = true }
zeroize = { workspace = true }

[features]
# A development platform that issues real passports and presentations, for
# tests of the crates that receive them. Off in every shipped build.
test-support = ["x509-cert/builder"]

[dev-dependencies]
# Tests build their own certificates.
x509-cert = { version = "0.3", features = ["builder"] }
# The recipient is exercised over a real store.
sid-storage = { workspace = true, features = ["storage-sqlite"] }
tokio = { workspace = true, features = ["macros", "rt"] }
