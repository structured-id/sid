[package]
name = "sid-fed"
description = "StructuredID Federation - X.509 certificate chains and instance discovery"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
sid-core = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
subtle = { workspace = true }
# The certificates a recipient verifies: their decoding, and RFC 5280 path
# processing from the shared PKIX implementation.
x509-cert = { version = "0.3" }
der = { version = "0.8", features = ["derive", "oid"] }
structured-pkix = { version = "0.21", features = ["alloc"] }
structured-asn1 = { version = "0.21", features = ["alloc"] }
p256 = { workspace = true, features = ["ecdsa", "pkcs8"] }

[dev-dependencies]
# Tests build their own certificates.
x509-cert = { version = "0.3", features = ["builder"] }
