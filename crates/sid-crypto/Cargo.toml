[package]
name = "sid-crypto"
version = "0.1.0"
edition.workspace = true
rust-version = "1.92"
license = "Apache-2.0"
repository.workspace = true
authors.workspace = true
description = "Independently selectable cryptographic primitives and TLS/JWT provider adapters"
readme = "README.md"
publish = true

[features]
default = ["std", "aws-lc", "tls-aws-lc", "jwt"]
alloc = ["pki-types?/alloc", "aead?/alloc", "ed25519-dalek?/alloc"]
std = ["alloc", "thiserror/std", "pki-types?/std", "rustls?/std"]
# Explicit RustCrypto symmetric alternative to the default aws-lc adapter.
primitives = ["alloc", "dep:aes-gcm", "dep:hmac", "dep:hkdf", "dep:pbkdf2", "dep:sha2", "dep:getrandom"]
aws-lc = ["std", "dep:aws-lc-rs"]
fips = ["aws-lc", "aws-lc-rs/fips", "rustls?/fips"]
# The host explicitly installs the aws-lc JWT provider through this capability.
jwt = ["std", "dep:jsonwebtoken", "jsonwebtoken/aws_lc_rs"]
jwt-rustcrypto = ["std", "dep:jsonwebtoken", "dep:hmac", "dep:sha2", "dep:p256", "dep:p384", "dep:ed25519-dalek", "dep:rsa", "dep:der", "dep:crypto-bigint", "dep:signature-v2", "dep:signature", "dep:pkcs8"]
tls-aws-lc = ["std", "dep:rustls", "rustls/aws_lc_rs"]
tls-rustcrypto = ["alloc", "dep:rustls", "dep:pki-types", "dep:aead", "dep:aes-gcm", "dep:chacha20poly1305", "dep:crypto-common", "dep:crypto-bigint", "dep:der", "dep:digest", "dep:ed25519-dalek", "dep:getrandom", "dep:hmac", "dep:p256", "dep:p384", "dep:pkcs8", "dep:rsa", "dep:sec1", "dep:sha2", "dep:signature", "dep:x25519-dalek", "dep:zeroize"]
tls12 = ["rustls?/tls12"]
logging = ["rustls?/logging"]

[dependencies]
thiserror = { version = "2", default-features = false }
aws-lc-rs = { version = "1", optional = true }
jsonwebtoken = { version = "11", default-features = false, optional = true }
aead = { version = "0.6", default-features = false, optional = true }
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc", "zeroize"], optional = true }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["zeroize"], optional = true }
crypto-common = { version = "0.2", default-features = false, optional = true }
crypto-bigint = { version = "0.7.6", default-features = false, optional = true }
der = { version = "0.8", default-features = false, optional = true }
digest = { version = "0.11", default-features = false, optional = true }
ed25519-dalek = { version = "3", default-features = false, features = ["pkcs8", "zeroize"], optional = true }
getrandom = { version = "0.4", default-features = false, features = ["sys_rng"], optional = true }
hmac = { version = "0.13", default-features = false, features = ["zeroize"], optional = true }
hkdf = { version = "0.13", default-features = false, optional = true }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"], optional = true }
p256 = { version = "0.14", default-features = false, features = ["alloc", "pkcs8", "ecdsa", "ecdh"], optional = true }
p384 = { version = "0.14", default-features = false, features = ["alloc", "pkcs8", "ecdsa", "ecdh"], optional = true }
pkcs8 = { version = "0.11", default-features = false, optional = true }
pki-types = { package = "rustls-pki-types", version = "1", default-features = false, optional = true }
rsa = { version = "0.10.0-rc.19", default-features = false, features = ["sha2", "encoding"], optional = true }
rustls = { version = "0.23", default-features = false, optional = true }
sec1 = { version = "0.8", default-features = false, optional = true }
sha2 = { version = "0.11", default-features = false, features = ["zeroize"], optional = true }
signature = { version = "3", default-features = false, optional = true }
# jsonwebtoken's extension traits use signature 2; primitive backends use 3.
signature-v2 = { package = "signature", version = "2", default-features = false, optional = true }
x25519-dalek = { version = "3", default-features = false, features = ["static_secrets", "zeroize"], optional = true }
zeroize = { version = "1", default-features = false, optional = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
rcgen = "0.14"
# An independent TLS implementation is an oracle, never a product dependency.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
serde = { workspace = true }
serde_json = { workspace = true }

[[test]]
name = "jwt_installed"
required-features = ["jwt"]

[[test]]
name = "jwt_operation_first"
required-features = ["jwt"]

[[test]]
name = "jwt_other_provider"
required-features = ["jwt"]

[[test]]
name = "jwt_second_installation"
required-features = ["jwt"]

[[bench]]
name = "primitives"
harness = false
required-features = ["primitives", "aws-lc"]
