[package]
name = "sid-storage"
description = "StructuredID Storage Backends - sqlx for all CRUD + audit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[test]]
name = "postgres_integration"
required-features = ["storage-pg"]

[[test]]
name = "field_encryption_pg"
required-features = ["storage-pg"]

[features]
default = ["storage-pg"]

# PostgreSQL backend (full deployment)
storage-pg = ["dep:sqlx", "sqlx?/postgres", "sid-ids/sqlx-postgres"]

# SQLite backend (embedded-dev mode)
storage-sqlite = ["dep:sqlx", "sqlx?/sqlite", "sid-ids/sqlx-sqlite", "dep:libsqlite3-sys"]

# SID's records in a host's CoordiNode database, for a server host that
# embeds the engine over its own CoordiNode store. No SQL driver.
storage-coordinode = ["dep:coordinode-embed", "dep:coordinode-core", "dep:rmpv", "dep:rmp-serde"]

[dependencies]
sid-ids = { workspace = true, features = ["std", "serde"] }
sid-core = { workspace = true }
sid-keys = { workspace = true }
sid-plugin = { workspace = true }

# SQL — backend layer (features selected per storage backend)
sqlx = { workspace = true, features = ["runtime-tokio", "uuid", "chrono", "json", "ipnet"], optional = true }
# SQLite's C API, for the SQL functions SID registers on its connections. The
# version sqlx links: one SQLite library per binary.
libsqlite3-sys = { version = "0.37", optional = true }
# The host's CoordiNode database and its value type.
coordinode-embed = { version = "0.9", optional = true }
coordinode-core = { version = "0.9", optional = true }
# CoordiNode's nested document value: a free-form JSON value is stored as a
# document, not as serialized text.
rmpv = { version = "1", features = ["with-serde"], optional = true }
# A record's struct into that document by field name, so a field left out
# never moves the ones after it.
rmp-serde = { version = "1", optional = true }

# Async
async-trait = { workspace = true }
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }

# UUID
uuid = { workspace = true }

# Time
chrono = { workspace = true }

# Secrets — needed for EmailProviderConfig SecretBox fields
secrecy = { workspace = true }

[dev-dependencies]
sid-crypto = { workspace = true, features = ["std", "primitives"] }
# Field-encryption integration tests are #[tokio::test]; the library itself
# needs no macros, so the attribute is enabled here only.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# The capability conformance scenarios both backends run.
sid-plugin = { workspace = true, features = ["conformance"] }
# Two SQLite backends on one database file (instances sharing a store).
tempfile = "3"
# Many concurrent calls on one borrowed store (replicas racing).
futures = { workspace = true }
# History epochs carry real Pallas public keys, as the archive checks.
pasta_curves = { workspace = true }
group = { workspace = true }
# The restore scenario names another database on the configured server.
url = { workspace = true }
