[package]
name = "sid-core"
description = "StructuredID Core - Domain models, errors, and shared types"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
sid-ids = { workspace = true, features = ["std", "serde"] }
sid-keys = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
subtle = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
zeroize = { workspace = true }
secrecy = { workspace = true }
rand = { workspace = true }
url = { workspace = true }
cloudevents-sdk = "0.9"
# A history epoch's public key is a compressed Pallas point
pasta_curves = { workspace = true }
group = { workspace = true }

# Recovery seed phrase (BIP-39 + key derivation)
pbkdf2 = { workspace = true, optional = true }
hkdf = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
aes-gcm = { workspace = true, optional = true }

[features]
default = ["recovery"]
recovery = ["dep:pbkdf2", "dep:hkdf", "dep:hmac", "dep:aes-gcm"]
