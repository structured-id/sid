[package]
name = "sid-admin"
description = "StructuredID admin ops library — backup, integrity verification, bulk user import"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
sid-core = { workspace = true }
sid-keys = { workspace = true }
sid-plugin = { workspace = true }
sid-authn = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Import is checked against a real in-memory store.
sid-storage = { workspace = true, features = ["storage-sqlite"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
aes-gcm = { workspace = true }
pbkdf2 = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
