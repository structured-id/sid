[package]
name = "sid-plugin"
description = "StructuredID Plugin API - Traits for extending StructuredID"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
sid-core = { workspace = true }
sid-crypto = { workspace = true, features = ["std"] }
sid-keys = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# Many concurrent calls on one store in the conformance scenarios.
futures = { workspace = true, optional = true }
# History epochs in the conformance scenarios carry real Pallas public keys.
pasta_curves = { workspace = true, optional = true }
group = { workspace = true, optional = true }
secrecy = { workspace = true }
zeroize = { workspace = true }

# Outbound HTTP and the TLS provider it needs (see src/http.rs)
reqwest = { workspace = true }
rustls = { workspace = true }
url = { workspace = true }

[features]
# The capability conformance scenarios a backend's tests run against it.
conformance = ["tokio/macros", "tokio/time", "dep:futures", "dep:pasta_curves", "dep:group"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
# The in-memory cache runs the cache conformance scenarios.
sid-plugin = { path = ".", features = ["conformance"] }
