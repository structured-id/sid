[package]
name = "sid-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# gRPC / Protobuf
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
sid-ids-proto = { workspace = true }

[dev-dependencies]
# Reads the `google.api.http` method option, an extension prost-types drops.
prost-reflect = { workspace = true }

[build-dependencies]
tonic-build = "0.14"
tonic-prost-build = "0.14"
prost-build = "0.14"
glob = "0.3"
