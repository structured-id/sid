[package]
name = "sid-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "StructuredID CE API messages and their optional gRPC stubs, generated from the bundled proto sources"
# The proto sources the build compiles travel with the package.
include = [
    "src/**/*",
    "build.rs",
    "proto/LICENSE",
    "proto/google/**/*.proto",
    "proto/sid/v1/**/*.proto",
]

[dependencies]
prost = "0.14"
prost-types = "0.14"
sid-ids-proto = { workspace = true }
# The generated gRPC client and server stubs (optional)
tonic = { version = "0.14", optional = true }
tonic-prost = { version = "0.14", optional = true }

[features]
grpc = ["dep:tonic", "dep:tonic-prost"]

[dev-dependencies]
# Reads the `google.api.http` method option, an extension prost-types drops.
prost-reflect = { workspace = true }

[build-dependencies]
tonic-build = "0.14"
tonic-prost-build = "0.14"
prost-build = "0.14"
glob = "0.3"
# Checks every method's retry rule and binds the keyed methods.
sid-proto-build = { workspace = true }
