[package]
name = "sid-auth-proxy"
description = "StructuredID Application Proxy — BFF, auth translation, upstream proxying (standalone PEP binary)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "sid-auth-proxy"
path = "src/main.rs"

[lib]
name = "sid_auth_proxy"
path = "src/lib.rs"

[dependencies]
# Token claims, issuer registry and revocation view shared with the decision service.
sid-auth = { path = "../sid-auth", default-features = false }
sid-authn = { workspace = true }
sid-core = { workspace = true }
sid-plugin = { workspace = true }
sid-proto = { workspace = true }

# HTTP framework (router assembly)
axum = { workspace = true }
tower-http = { workspace = true }

# gRPC client (channel to the SID server)
tonic = { workspace = true }
tonic-health = { workspace = true }

# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
chrono = { workspace = true }

# BFF: PKCE, CSRF comparison
getrandom = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
subtle = { workspace = true }
# BFF: its client key's assertions (RFC 7523) and connection proofs
jsonwebtoken = { workspace = true }
ed25519-dalek = { workspace = true, features = ["pkcs8", "pem"] }
# BFF: account API proxying, bodies streamed through
reqwest = { workspace = true, features = ["stream"] }
url = { workspace = true }

# Metrics and rate limiting
prometheus = { workspace = true }
dashmap = { workspace = true }
async-trait = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"
# Replica tests run against the real shared cache.
sid-infra = { workspace = true }
