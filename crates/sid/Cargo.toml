[package]
name = "structured-id"
description = "StructuredID CE engine library: open an installation, run its durable work and the maintenance it owes, transport-free"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# The crates.io name `sid` belongs to another project; the library keeps it.
[lib]
name = "sid"

[dependencies]
sid-authn = { workspace = true, features = ["keyed", "password-operation"] }
# The fixed CE built-in roles; no transport.
sid-authz = { path = "../sid-authz", default-features = false }
sid-core = { workspace = true }
# The primitives trait only: the host selects the provider.
sid-crypto = { workspace = true }
sid-keys = { workspace = true }
sid-plugin = { workspace = true }
chrono = { workspace = true }
secrecy = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
sid-crypto = { workspace = true, features = ["primitives"] }
sid-storage = { workspace = true, features = ["storage-pg", "storage-sqlite"] }
sqlx = { workspace = true, features = ["postgres"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[lints.rust]
unreachable_pub = "warn"
