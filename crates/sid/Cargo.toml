[package]
name = "structured-id"
description = "StructuredID CE engine library: open an installation, run its durable work and the maintenance it owes, transport-free"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# The crates.io name `sid` belongs to another project; the library keeps it.
[lib]
name = "sid"

[dependencies]
sid-authn = { workspace = true, features = ["keyed", "password-operation"] }
# The fixed CE built-in roles; no transport.
sid-authz = { path = "../sid-authz", version = "0.2", default-features = false }
sid-core = { workspace = true }
# The primitives trait only: the host selects the provider.
sid-crypto = { workspace = true }
sid-keys = { workspace = true }
sid-plugin = { workspace = true }
# The snapshot format, import rules and archive; no backend is selected here.
sid-storage = { workspace = true }
# The management operations' requests and answers: the API's messages as
# data, the same for every entry point.
sid-proto = { workspace = true }
sid-ids-proto = { workspace = true }
# The identifier kinds of stored references an answer carries.
sid-ids = { workspace = true, features = ["std"] }
# The stored form of sealed email provider credentials.
base64 = { workspace = true }
# IP allowlist entries, validated as addresses or CIDR blocks.
ipnet = { workspace = true }
# Hex-encoded export checksums.
hex = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
# The grant engine's host trait.
async-trait = { workspace = true }
# Hashes of issued client secrets.
argon2 = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
secrecy = { workspace = true }
# The kept state of a sign-in between its steps.
serde = { workspace = true }
sha2 = { workspace = true }
serde_json = { workspace = true }
# Constant-time comparison of registration access tokens.
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
# The session store's write latency histogram.
opentelemetry = { workspace = true, optional = true }

[features]
telemetry = ["dep:opentelemetry"]

[dev-dependencies]
sid-crypto = { workspace = true, features = ["primitives", "jwt"] }
# The client half of a password sign-in.
sid-opaque-ke = { workspace = true }
sid-pake-core = { workspace = true }
# A real passkey ceremony for the stored-passkey conversions.
sid-authn = { workspace = true, features = ["keyed", "password-operation", "soft-authenticator"] }
# Signs the device-key proofs of the enrollment ceremony tests.
jsonwebtoken = { workspace = true }
sid-storage = { workspace = true, features = ["storage-pg", "storage-sqlite"] }
sqlx = { workspace = true, features = ["postgres"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[lints.rust]
unreachable_pub = "warn"
