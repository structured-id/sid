[package]
name = "sid-notify"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "StructuredID notification delivery service"

[lib]
name = "sid_notify"
path = "src/lib.rs"

[[bin]]
name = "sid-notify"
path = "src/main.rs"

[dependencies]
sid-core = { workspace = true, features = ["grpc"] }
sid-plugin = { workspace = true }
sid-authn = { workspace = true, features = ["grpc"] }
# The shared receiver: calls are admitted with tokens for the installation's
# account API resource, decided by its issuer.
sid-auth = { workspace = true, default-features = false }
sid-infra = { workspace = true, features = ["nats"] }
sid-serve = { workspace = true }
# Durable job store in this service's own PostgreSQL database.
sid-storage = { workspace = true, features = ["storage-pg"] }

# Async runtime
tokio = { workspace = true }
async-trait = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Time
chrono = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# UUID
uuid = { workspace = true }

# Template engine
handlebars = "6"

# SMTP email delivery
lettre = { workspace = true }

# Crypto (HMAC-SHA256 for webhooks)
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

# HTTP client (XOAUTH2 token endpoints: Azure AD, Google)
reqwest = { workspace = true }

# JWT (Google service account JWT-bearer token exchange)
jsonwebtoken = { workspace = true }
# The process's JWT signature provider, installed at startup.
sid-crypto = { workspace = true, features = ["jwt", "tls-aws-lc"] }

# Secrets
secrecy = { workspace = true }

# NATS JetStream
async-nats = { workspace = true }
futures = { workspace = true }

# gRPC
tonic = { workspace = true }
tonic-reflection = { workspace = true }
sid-proto = { workspace = true, features = ["grpc"] }
prost = { workspace = true }
prost-types = { workspace = true }
# The Profile references the identity service takes and answers.
sid-ids = { workspace = true }
sid-ids-proto = { workspace = true }

# PostgreSQL (optional — for template persistence)
sqlx = { workspace = true, features = ["postgres"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
sid-storage = { workspace = true, features = ["storage-pg", "storage-sqlite"] }
tokio-stream = "0.1"
tempfile = "3"
# Every served method is called to check the error contract.
sid-serve = { workspace = true, features = ["error-contract"] }
# A real issuer the template API's receiver asks, over the network.
sid-test-issuer = { path = "../sid-test-issuer" }

[[bench]]
name = "durable_delivery"
harness = false
