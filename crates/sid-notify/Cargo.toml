[package]
name = "sid-notify"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "StructuredID notification delivery service"

[lib]
name = "sid_notify"
path = "src/lib.rs"

[[bin]]
name = "sid-notify"
path = "src/main.rs"

[dependencies]
sid-core = { workspace = true, features = ["grpc"] }
sid-plugin = { workspace = true }
sid-authn = { workspace = true, features = ["grpc"] }
sid-infra = { workspace = true }
sid-serve = { workspace = true }
# Durable job store in this service's own PostgreSQL database.
sid-storage = { workspace = true, features = ["storage-pg"] }

# Async runtime
tokio = { workspace = true }
async-trait = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Time
chrono = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# UUID
uuid = { workspace = true }

# Template engine
handlebars = "6"

# SMTP email delivery
lettre = { workspace = true }

# Crypto (HMAC-SHA256 for webhooks)
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

# HTTP client (XOAUTH2 token endpoints: Azure AD, Google)
reqwest = { workspace = true }

# JWT (Google service account JWT-bearer token exchange)
jsonwebtoken = { workspace = true }

# Secrets
secrecy = { workspace = true }

# NATS JetStream
async-nats = { workspace = true }
futures = { workspace = true }

# gRPC
tonic = { workspace = true }
tonic-reflection = { workspace = true }
sid-proto = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }

# PostgreSQL (optional — for template persistence)
sqlx = { workspace = true, features = ["postgres"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
sid-storage = { workspace = true, features = ["storage-pg", "storage-sqlite"] }
tokio-stream = "0.1"
tempfile = "3"
# Every served method is called to check the error contract.
sid-serve = { workspace = true, features = ["error-contract"] }
