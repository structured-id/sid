[package]
name = "engine-package-consumer"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

# Every SID crate resolves by version; the check adds a `[patch.crates-io]`
# section naming the unpacked archives, so nothing is read from the
# workspace that produced them.
[dependencies]
sid = { package = "structured-id", version = "0.2" }
sid-authn = "0.2"
sid-authz = { version = "0.2", default-features = false }
sid-core = "0.2"
sid-plugin = "0.2"
sid-proto = "0.2"
sid-storage = { version = "0.2", default-features = false, features = ["storage-sqlite"] }
# The host selects pure-Rust primitives and the JWT provider.
sid-crypto = { version = "0.1", default-features = false, features = ["std", "primitives", "jwt-rustcrypto"] }
async-trait = "0.1"
chrono = "0.4"
secrecy = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
url = "2"
uuid = { version = "1", features = ["v7"] }
