[package]
name = "engine-package-consumer"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

# The host's store, one per build: the check runs each.
[features]
default = ["sqlite"]
sqlite = ["sid-storage/storage-sqlite"]
coordinode = ["sid-storage/storage-coordinode", "dep:coordinode-embed"]

# Every SID crate resolves by version; the check adds a `[patch.crates-io]`
# section naming the unpacked archives, so nothing is read from the
# workspace that produced them.
[dependencies]
sid = { package = "structured-id", version = "0.2" }
sid-authn = "0.2"
sid-authz = { version = "0.2", default-features = false }
sid-core = "0.2"
sid-plugin = "0.2"
sid-proto = "0.2"
sid-storage = { version = "0.2", default-features = false }
# The host selects pure-Rust primitives and the JWT provider.
sid-crypto = { version = "0.1", default-features = false, features = ["std", "primitives", "jwt-rustcrypto", "tls-rustcrypto"] }
# The client half of OPAQUE registration and sign-in, as an application's
# client runs it.
sid-opaque-ke = "4.2"
sid-pake-core = "0.1"
# Typed identifiers of the wire messages the host reads.
sid-ids = "0.8"
sid-ids-proto = "0.1"
# The field and curve encodings of the history evaluation and the proof.
ff = "0.14"
group = "0.14"
pasta_curves = "0.6"
rand = "0.10"
# The device's own key proofs, signed with the JWT provider the host selects.
jsonwebtoken = "11"
base64 = "0.23"
serde_json = "1"
# The host's own CoordiNode database.
coordinode-embed = { version = "0.9", optional = true }
async-trait = "0.1"
chrono = "0.4"
secrecy = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
url = "2"
uuid = { version = "1", features = ["v7"] }

# The proof arithmetic, optimized as in the engine workspace: its keygen
# and proving are 10-20x slower without it.
[profile.dev.package.halo2_proofs]
opt-level = 3
[profile.dev.package.halo2_gadgets]
opt-level = 3
[profile.dev.package.pasta_curves]
opt-level = 3
[profile.dev.package.ff]
opt-level = 3
[profile.dev.package.group]
opt-level = 3
[profile.dev.package.sid-pake-core]
opt-level = 2
