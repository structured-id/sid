# nextest configuration for SID CE workspace
# Docs: https://nexte.st/docs/configuration/

experimental = ["setup-scripts"]

# Each shared PostgreSQL test database is migrated once per run, before the
# tests that use it; tests connect without migrating it. Each test runs in
# its own process, so migrating per test repeated the whole migration check,
# queued on the migrator's lock, in every test. Only the tests that reach a
# shared database run its script, so suites on SQLite or no database stay
# runnable without the compose stack. A test reaching a database its script
# did not prepare fails, naming the cause: add its binary here.
[scripts.setup.engine-database]
command = "cargo run --locked --quiet -p sid-storage --features test-support --example prepare_test_database -- engine"

[scripts.setup.storage-database]
command = "cargo run --locked --quiet -p sid-storage --features test-support --example prepare_test_database -- storage"

[[profile.default.scripts]]
filter = """
binary_id(sid-scim::scim_integration)
| binary_id(structured-id::audit_partition) | binary_id(structured-id::closure_lifecycle)
| binary_id(sid-server::anomaly_event_log) | binary_id(sid-server::authz_service_authz)
| binary_id(sid-server::authz_service_errors) | binary_id(sid-server::device_location_integration)
| binary_id(sid-server::email_handles) | binary_id(sid-server::enrollment_pg)
| binary_id(sid-server::ip_allowlist_integration) | binary_id(sid-server::ip_reputation_integration)
| binary_id(sid-server::keyed_assign_role) | binary_id(sid-server::keyed_store_conflicts)
| binary_id(sid-server::machine_credential_pg) | binary_id(sid-server::magic_link_e2e)
| binary_id(sid-server::mfa_enrollment) | binary_id(sid-server::new_ip_detection)
| binary_id(sid-server::pat_admin_pg) | binary_id(sid-server::role_administration)
| binary_id(sid-server::role_administration_api) | binary_id(sid-server::set_role_assignments)
"""
setup = "engine-database"

[[profile.default.scripts]]
filter = """
binary_id(sid-storage::postgres_integration) | binary_id(sid-storage::field_encryption_pg)
| (binary_id(sid-storage::host_mutation) & test(/^postgres::/))
| (binary_id(sid-storage) & (test(/^audit_log::/) | test(/^postgres::work::/)))
"""
setup = "storage-database"

[profile.default]
# Default: 8 parallel test threads
test-threads = 8
# Default timeout: 2 minutes (covers backchannel retry tests ~30s)
slow-timeout = { period = "30s", terminate-after = 4 }

[[profile.default.overrides]]
filter = "package(sid-crypto)"
slow-timeout = { period = "60s", terminate-after = 10 }

# Backchannel logout + IP intelligence tests have 30s real timeouts
[[profile.default.overrides]]
filter = "test(backchannel_logout) | test(ip_intelligence)"
slow-timeout = { period = "30s", terminate-after = 4 }

# The full OPAQUE flow runs the suite's real KSF — 600,000 PBKDF2 iterations,
# twice, in an unoptimized build. That cost is the function's purpose and the
# test's point is that the shipped cipher suite works end to end, so it is not
# something to tune away; what it needs is a budget that a loaded machine
# cannot turn into a false failure. Tests that only check KDF behaviour use a
# cheap work factor instead and run in milliseconds.
[[profile.default.overrides]]
filter = "test(test_full_registration_login_flow)"
slow-timeout = { period = "60s", terminate-after = 5 }

# Every password operation here makes and verifies a genuine ZKPP proof in
# an unoptimized build: 60-100 s per test on a loaded CI runner (the depth
# edit test commits three such changes). The budget catches a hang; it is
# not a performance bound.
[[profile.default.overrides]]
filter = "binary_id(sid-server::zkpp_password_change) | test(a_depth_edit_compares_its_window_through_committed_changes)"
slow-timeout = { period = "60s", terminate-after = 5 }

# The installed single-thread TS prover generates four genuine proofs, plus
# production client Argon2 registrations/logins. Bound the whole lifecycle;
# do not replace the prover or lower its KSF to fit a unit-test timeout.
[[profile.default.overrides]]
filter = "test(published_client_completes_password_lifecycle) | test(published_browser_completes_password_lifecycle)"
slow-timeout = { period = "60s", terminate-after = 5 }
# Alone: each prover is single-threaded, and anything scheduled beside it
# (the other packaged prover, or the ZKPP tests whose Rust prover takes every
# core) starves it past its budget.
threads-required = "num-test-threads"

# ── CI profile ──
[profile.ci]
test-threads = 8
slow-timeout = { period = "30s", terminate-after = 4 }
# JUnit output for CI
junit = { path = "test-results/junit.xml" }
