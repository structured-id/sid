# cargo-deny configuration for StructuredID
# https://embarkstudios.github.io/cargo-deny/

[advisories]
ignore = [
    # rsa timing side-channel (Marvin Attack) — no fix available.
    # Pulled in via sqlx-mysql (we use PostgreSQL only, mysql feature is transitive from sea-orm).
    "RUSTSEC-2023-0071",
    # rustls-pemfile unmaintained — transitive via async-nats → rustls-native-certs.
    # No action needed until async-nats migrates.
    "RUSTSEC-2025-0134",
    # atomic-polyfill unmaintained (no vulnerability): phonenumber 0.3.10, the
    # latest release, takes postcard with its default features, which enable
    # heapless 0.7 "cas" and with it atomic-polyfill. On every target this
    # server builds for, atomic-polyfill re-exports the native core atomics.
    "RUSTSEC-2023-0089",
]

[licenses]
allow = [
    # The license of this workspace's own crates.
    "AGPL-3.0-only",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
