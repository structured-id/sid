# release-plz config for sid CE workspace
# Релизим ТОЛЬКО бинарный crate (sid-server). Остальные crates не теггаются
# чтобы один tag = одна версия бинаря.
#
# Workflow (локальный):
#   release-plz update
#   git push
#   release-plz release  → git tag vX.Y.Z + GitLab release
# → docker-tag CI пушит registry.gitlab.com/structured-id/sid:vX.Y.Z.
# → cd ../deploy && ./scripts/sync-chart-version.sh sid X.Y.Z
[workspace]
publish = false
release = false                       # default: library crates не релизятся
semver_check = false
changelog_update = false

# Единственный crate который действительно релизится — бинарь.
[[package]]
name = "sid-server"
release = true
publish = false
git_release_enable = true
git_tag_enable = true
git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"
changelog_update = false
