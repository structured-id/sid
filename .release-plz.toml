# release-plz configuration for the sid workspace: one release PR for every
# released package, each with its own version, changelog and tag, selected by
# its own changes since that tag.
# The server binary (sid-server) is tagged `v<version>` and not published.
# sid-crypto and the vendored protocol crates (sid-voprf, sid-opaque-ke) are
# published to crates.io, tagged `<crate>-v<version>`. Every other library
# crate is neither tagged nor published by this configuration.
[workspace]
publish = false
release = false
semver_check = false
changelog_update = false
# The edition's crates are on no registry: what a crate released last is read
# from the server's v{{ version }} tag, which the crates sharing the workspace
# version have in common. Only the server creates that tag and its release.
git_only = true
git_tag_name = "v{{ version }}"
git_tag_enable = false
git_release_enable = false
pr_name = "chore: release"
pr_branch_prefix = "release-plz-"
# Publish only when the release PR is merged, not on every push.
release_always = false

[[package]]
name = "sid-server"
release = true
publish = false
# Its released version comes from its v{{ version }} tags: it is on no
# registry, and against crates.io every version looks like the first.
git_only = true
git_release_enable = true
git_tag_enable = true
git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"
# Its v{{ version }} release is the whole community edition: the entries
# also list the product's crates that have no release of their own, since a
# commit is attributed to the package whose directory it touches.
changelog_update = true
changelog_path = "CHANGELOG.md"
changelog_include = [
  "sid-admin",
  "sid-attestation",
  "sid-auth",
  "sid-auth-proxy",
  "sid-authn",
  "sid-authz",
  "sid-core",
  "sid-fed",
  "sid-i18n",
  "sid-infra",
  "sid-keys",
  "sid-migrate",
  "sid-notify",
  "sid-org-crypto",
  "sid-plugin",
  "sid-proto",
  "sid-proto-build",
  "sid-scim",
  "sid-serve",
  "sid-storage",
  "sid-ui-host",
  "structured-id",
]

# The edition's library crates. They are processed so that a commit touching
# only one of them is found: release-plz gathers the commits a package
# includes (changelog_include above) from processed packages alone. None of
# them is published, tagged or released on its own.
[[package]]
name = "sid-admin"
release = true

[[package]]
name = "sid-attestation"
release = true

[[package]]
name = "sid-auth"
release = true

[[package]]
name = "sid-auth-proxy"
release = true

[[package]]
name = "sid-authn"
release = true

[[package]]
name = "sid-authz"
release = true

[[package]]
name = "sid-core"
release = true

[[package]]
name = "sid-fed"
release = true

[[package]]
name = "sid-i18n"
release = true

[[package]]
name = "sid-infra"
release = true

[[package]]
name = "sid-keys"
release = true

[[package]]
name = "sid-migrate"
release = true

[[package]]
name = "sid-notify"
release = true

[[package]]
name = "sid-org-crypto"
release = true

[[package]]
name = "sid-plugin"
release = true

[[package]]
name = "sid-proto"
release = true

[[package]]
name = "sid-proto-build"
release = true

[[package]]
name = "sid-scim"
release = true

[[package]]
name = "sid-serve"
release = true

[[package]]
name = "sid-storage"
release = true

[[package]]
name = "sid-ui-host"
release = true

[[package]]
name = "structured-id"
release = true

[[package]]
name = "sid-crypto"
release = true
publish = true
# On crates.io: its released state is the registry's, not a git tag.
git_only = false
semver_check = true
changelog_update = true
changelog_path = "crates/sid-crypto/CHANGELOG.md"
git_release_enable = true
# The server's release stays the repository's latest.
git_release_latest = false
git_tag_enable = true
git_tag_name = "{{ package }}-v{{ version }}"
git_release_name = "{{ package }} v{{ version }}"

[[package]]
name = "sid-voprf"
release = true
publish = true
git_only = false
semver_check = true
changelog_update = true
changelog_path = "crates/sid-voprf/CHANGELOG.md"
git_release_enable = true
git_tag_enable = true
git_tag_name = "{{ package }}-v{{ version }}"
git_release_name = "{{ package }} v{{ version }}"

[[package]]
name = "sid-opaque-ke"
release = true
publish = true
git_only = false
semver_check = true
changelog_update = true
changelog_path = "crates/sid-opaque-ke/CHANGELOG.md"
git_release_enable = true
git_tag_enable = true
git_tag_name = "{{ package }}-v{{ version }}"
git_release_name = "{{ package }} v{{ version }}"
