# release-plz configuration for the sid workspace: one release PR for every
# released package, each with its own version, changelog and tag, selected by
# its own changes since that tag.
# The server binary (sid-server) is tagged `v<version>` and not published.
# sid-crypto and the vendored protocol crates (sid-voprf, sid-opaque-ke) are
# published to crates.io, tagged `<crate>-v<version>`. Every other library
# crate is neither tagged nor published by this configuration.
[workspace]
publish = false
release = false
semver_check = false
changelog_update = false
pr_name = "chore: release"
pr_branch_prefix = "release-plz-"
# Publish only when the release PR is merged, not on every push.
release_always = false

[[package]]
name = "sid-server"
release = true
publish = false
# Its released version comes from its v{{ version }} tags: it is on no
# registry, and against crates.io every version looks like the first.
git_only = true
git_release_enable = true
git_tag_enable = true
git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"
changelog_update = false

[[package]]
name = "sid-crypto"
release = true
publish = true
semver_check = true
changelog_update = true
changelog_path = "crates/sid-crypto/CHANGELOG.md"
git_release_enable = true
# The server's release stays the repository's latest.
git_release_latest = false
git_tag_enable = true
git_tag_name = "{{ package }}-v{{ version }}"
git_release_name = "{{ package }} v{{ version }}"

[[package]]
name = "sid-voprf"
release = true
publish = true
semver_check = true
changelog_update = true
changelog_path = "crates/sid-voprf/CHANGELOG.md"
git_release_enable = true
git_tag_enable = true
git_tag_name = "{{ package }}-v{{ version }}"
git_release_name = "{{ package }} v{{ version }}"

[[package]]
name = "sid-opaque-ke"
release = true
publish = true
semver_check = true
changelog_update = true
changelog_path = "crates/sid-opaque-ke/CHANGELOG.md"
git_release_enable = true
git_tag_enable = true
git_tag_name = "{{ package }}-v{{ version }}"
git_release_name = "{{ package }} v{{ version }}"
