# StructuredID CE: authentication service beside your application
#
# Starts with no database to configure: SID keeps its users, keys and
# sessions in SQLite on the `sid_data` volume, which survives restarts.
#
# Usage:
#   1. Copy this file to your project
#   2. Merge it with your docker-compose.yml
#      (or `docker compose -f docker-compose.yml -f docker-compose.embedded.yml up`)
#   3. Set SID_ISSUER to the URL your application and browsers reach SID at
#   4. SID generates its keys on first start
#
# To keep SID's data in your PostgreSQL instead, add
# docker-compose.postgres.yml as well; it switches to the PostgreSQL image.
#
# Ports:
#   - 8090: HTTP (sign-in pages, OIDC, REST)
#   - 50051: gRPC (native clients)

services:
  sid:
    # The newest released SQLite server; pin a release with
    # SID_IMAGE=ghcr.io/structured-id/sid:<version>-embedded.
    image: "${SID_IMAGE:-ghcr.io/structured-id/sid:embedded}"
    environment:
      # The URL clients and browsers use; it names every token SID issues.
      SID_ISSUER: "${SID_ISSUER:-http://localhost:8090}"
      RUST_LOG: "${SID_LOG_LEVEL:-sid=info}"
    ports:
      - "${SID_HTTP_PORT:-8090}:8080"
      - "${SID_GRPC_PORT:-50051}:50051"
    volumes:
      # The SQLite database and the generated keys.
      - sid_data:/var/lib/sid
    restart: unless-stopped

volumes:
  sid_data:
